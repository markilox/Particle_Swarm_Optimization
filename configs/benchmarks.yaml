# Benchmark suite configuration
# Available objectives: sphere, rastrigin, rosenbrock, ackley
# Available evaluators: sequential, threading, multiprocessing, asyncio

objectives:
  - sphere
  - rastrigin
  - rosenbrock
  - ackley

dimensions:
  - 2
  - 10
  - 30

evaluators:
  - sequential
  - threading
  - multiprocessing
  - asyncio

seeds:
  - 42
  - 43
  - 44
  - 45
  - 46

swarm_size: 30
iterations: 200
inertia: 0.7
cognitive: 1.5
social: 1.5

# Workers for threading/multiprocessing (null = Python default)
# With swarm_size=30, max_workers=4 gives ~7-8 particles/worker — better overhead ratio
max_workers: 4

# asyncio-specific params (V3 — only used when "asyncio" is in evaluators)
# latency_s=0 + jitter=0 → measures pure coroutine overhead vs sequential (expected: slightly slower)
# set latency_s > 0 to simulate I/O-bound evaluation (asyncio's real advantage)
asyncio_latency_s: 0.0
asyncio_jitter: 0.0

output_dir: results/benchmarks
